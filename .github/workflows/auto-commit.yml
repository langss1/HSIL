name: Scheduled Commit and Push

on:
  schedule:
    # Berjalan setiap hari jam 14:00 UTC (21:00 WIB / 9 PM WIB)
    - cron: '0 14 * * *'
  # Menambahkan trigger ini agar kamu bisa mengetesnya secara manual dari tombol di web GitHub
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Menyimpan username dan email sebagai environment variables
    # (Nilainya harus diatur di Settings > Secrets and variables > Actions)
    env:
      GIT_USER_NAME: ${{ secrets.GIT_USER_NAME }}
      GIT_USER_EMAIL: ${{ secrets.GIT_USER_EMAIL }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Make changes (Update log file otomatis)
      run: |
        echo "Auto update: $(date)" >> update-log.txt

    - name: Commit and Push
      run: |
        git config --global user.name "${{ env.GIT_USER_NAME }}"
        git config --global user.email "${{ env.GIT_USER_EMAIL }}"
        git add update-log.txt
        # Tambahkan handle error jika tidak ada perubahan
        git commit -m "Umpan otomatis dari GitHub Actions" || echo "No changes to commit"
        git push
